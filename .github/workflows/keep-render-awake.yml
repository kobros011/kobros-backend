name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          curl --fail --silent --show-error --location \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --write-out "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://kobros-api.onrender.com/docs"
